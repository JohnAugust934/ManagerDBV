<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#002F6C">
    <title>Sem conexão — Desbravadores Manager</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at top, #003a85, #001d42 60%);
            color: #e2e8f0;
            text-align: center;
        }
        .card {
            max-width: 28rem;
            width: 100%;
        }
        .logo {
            width: 84px;
            height: 84px;
            margin: 0 auto 1.5rem;
            display: block;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, .4));
        }
        h1 { font-size: 1.4rem; font-weight: 800; margin: 0 0 .5rem; color: #fff; }
        p { font-size: .95rem; line-height: 1.5; margin: 0 0 1.75rem; color: #94a3b8; }
        button {
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            border: 0;
            border-radius: 9999px;
            padding: .8rem 1.75rem;
            color: #fff;
            background: #D9222A;
            box-shadow: 0 8px 20px rgba(217, 34, 42, .35);
            transition: transform .15s ease, opacity .15s ease;
        }
        button:active { transform: scale(.96); }
    </style>
</head>
<body>
    <div class="card">
        <img class="logo" src="/favicon.svg" alt="Desbravadores Manager">
        <h1>Você está sem conexão</h1>
        <p>Não foi possível carregar esta tela. Verifique sua internet e tente novamente — seus dados continuam seguros no servidor.</p>
        <button onclick="location.reload()">Tentar novamente</button>
    </div>
</body>
</html>
